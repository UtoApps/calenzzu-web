<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="600" height="440" role="img" aria-label="Calenzzu">
  <title>Calenzzu — logo vertical</title>
  <!-- Símbolo arriba, nombre debajo. Es el formato para la portada de la landing
       y para la ficha de las tiendas. Mismo aviso que en el horizontal: el texto
       depende de Nunito Sans, hay que trazarlo antes de publicarlo fuera. -->
  <defs>
    <linearGradient id="cz-violeta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#5B2EE5"/>
    </linearGradient>
    <linearGradient id="cz-verde" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#12A177"/><stop offset="1" stop-color="#53E8B2"/>
    </linearGradient>
    <linearGradient id="cz-cruce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5BDD"/><stop offset="1" stop-color="#1F9AA0"/>
    </linearGradient>
    <linearGradient id="cz-zz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B3AEA"/><stop offset="1" stop-color="#17A97C"/>
    </linearGradient>
    <clipPath id="cz-marco"><rect x="2" y="2" width="116" height="116" rx="30"/></clipPath>
    <rect id="cz-masa-a" x="-22" y="-22" width="98" height="98" rx="30"/>
    <rect id="cz-masa-b" x="44" y="44" width="98" height="98" rx="30"/>
    <clipPath id="cz-corte-a"><use href="#cz-masa-a"/></clipPath>
  </defs>

  <g transform="translate(90,6)">
    <g clip-path="url(#cz-marco)">
      <use href="#cz-masa-a" fill="url(#cz-violeta)"/>
      <use href="#cz-masa-b" fill="url(#cz-verde)"/>
      <g clip-path="url(#cz-corte-a)"><use href="#cz-masa-b" fill="url(#cz-cruce)"/></g>
    </g>
    <ellipse cx="60" cy="60" rx="15" ry="20" fill="#FFFFFF" transform="rotate(-14 60 60)"/>
  </g>

  <text x="150" y="196" text-anchor="middle"
        font-family="Nunito Sans, Nunito, DejaVu Sans, sans-serif"
        font-size="56" font-weight="800" letter-spacing="-2" fill="#1E1B39">Calen<tspan
        fill="url(#cz-zz)">zz</tspan>u</text>
</svg>
